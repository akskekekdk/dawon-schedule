.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 40px)}

/* 나무 간판 제목 */
header{position:relative;display:block;width:fit-content;margin:0 auto;text-align:center;padding:12px 22px 12px 52px;border-radius:18px;
  background:repeating-linear-gradient(0deg,var(--wood) 0 14px,#c48755 14px 16px);
  border:4px solid var(--wood-d);box-shadow:0 5px 0 var(--wood-d),0 10px 18px rgba(80,50,20,.25);color:#fff8e8}
header::before{content:"";position:absolute;left:14px;top:50%;width:26px;height:26px;margin-top:-13px;
  background:var(--leaf);border-radius:0 70% 0 70%;transform:rotate(-12deg);box-shadow:inset -3px -3px 0 var(--leaf-d)}
header h1{margin:0;font-size:28px;font-weight:400;letter-spacing:.5px;text-shadow:0 2px 0 var(--wood-d)}
#selLabel{margin-top:2px;font-size:16px;color:#fff3d6;text-shadow:0 1px 0 var(--wood-d)}

.people{display:flex;gap:10px;margin-top:18px}
.pbtn{flex:1;height:50px;border-radius:999px;border:3px solid #fff;font:inherit;font-size:19px;
  display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  transition:transform .08s, box-shadow .08s;color:#fff;filter:saturate(.55) brightness(1.05)}
.pbtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
.pbtn.sw{background:var(--blue);box-shadow:0 5px 0 var(--blue-d)}
.pbtn.dy{background:var(--red);box-shadow:0 5px 0 var(--red-d)}
.pbtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.pbtn.on{filter:none;transform:translateY(-2px) scale(1.03);outline:3px dashed rgba(255,255,255,.9);outline-offset:3px}
.pbtn.on .dot{background:var(--sel);box-shadow:0 0 0 3px #fff}

.compose{display:flex;gap:8px;margin-top:14px}
.compose input{flex:1;min-width:0;height:46px;border-radius:999px;border:3px solid #fff;padding:0 16px;
  background:var(--cream);color:var(--ink);font:inherit;font-size:16px;outline:none;box-shadow:0 4px 0 var(--cream2)}
.compose input::placeholder{color:#b9a78d}
.compose button{height:46px;padding:0 18px;border-radius:999px;border:3px solid #fff;font:inherit;font-size:17px;
  background:var(--leaf);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--leaf-d)}
.compose button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leaf-d)}
.compose button.sw{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.compose button.dy{background:var(--red);box-shadow:0 4px 0 var(--red-d)}

/* 달력: 크림색 수첩 */
.card{position:relative;margin-top:16px;background:var(--cream);border:4px solid #fff;border-radius:26px;
  padding:0 10px 12px;box-shadow:0 6px 0 var(--cream2),0 14px 24px rgba(60,90,80,.22);overflow:hidden}
.card::before{content:"";display:block;height:60px;margin:0 -10px 8px;
  background:radial-gradient(circle at 12px 60px,var(--cream) 10px,transparent 11px) 0 0/24px 60px repeat-x,var(--teal)}
.avatar{position:absolute;right:12px;top:10px;width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:3px solid #fff;box-shadow:0 3px 0 var(--teal-d);background:#fff;z-index:2}
.monthbar{position:absolute;top:10px;left:12px;right:62px;display:flex;align-items:center;gap:6px;z-index:2}
.monthbar h2{margin:0 2px;font-size:21px;font-weight:400;white-space:nowrap;color:#fff;text-shadow:0 2px 0 var(--teal-d)}
.nav{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--teal-d);color:#fff;font:inherit;font-size:18px;cursor:pointer;line-height:1;padding:0}
.today-btn{white-space:nowrap;flex:none;margin-left:auto;height:30px;padding:0 12px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.25);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:13px;color:var(--muted);padding:2px 0 4px}
.dow div:first-child{color:var(--red)}.dow div:last-child{color:var(--blue)}
.cell{min-height:70px;border-radius:14px;padding:4px 3px;display:flex;flex-direction:column;gap:2px;cursor:pointer;
  border:3px solid transparent;background:#fffdf5;box-shadow:0 2px 0 var(--cream2);overflow:hidden;
  font:inherit;color:inherit;text-align:left;transition:transform .1s}
.cell.empty{background:transparent;box-shadow:none;cursor:default}
.cell:not(.empty):active{transform:scale(.95)}
.cell .num{font-size:14px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.cell.sun .num{color:var(--red)}.cell.sat .num{color:var(--blue)}
.cell.today .num{background:var(--leaf);color:#fff}
.cell.sel{border-color:var(--sel);background:#fff6cc;box-shadow:0 3px 0 #e8c33a}
.cell.flash{animation:boing .5s ease}
@keyframes boing{0%{transform:scale(.9)}40%{transform:scale(1.08)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.chip{font-size:11px;line-height:16px;height:16px;border-radius:8px;padding:0 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sw{background:var(--blue)}.chip.dy{background:var(--red)}
.more{font-size:11px;color:var(--muted);padding-left:2px}

.panel{margin-top:16px;background:var(--cream);border:4px solid #fff;border-radius:24px;padding:14px;
  box-shadow:0 6px 0 var(--cream2),0 12px 20px rgba(60,90,80,.18)}
.panel h3{margin:0 0 10px;font-size:18px;font-weight:400;display:flex;align-items:center;justify-content:space-between}
.panel h3 span{background:var(--leaf);color:#fff;padding:3px 14px;border-radius:999px;box-shadow:0 3px 0 var(--leaf-d)}
.panel h3 small{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:16px;background:#fffdf5;
  border:2px dashed;box-shadow:0 2px 0 var(--cream2)}
.item.sw{border-color:#a9cff2}.item.dy{border-color:#f5b3ba}
.item .who{flex:none;font-size:13px;padding:3px 10px;border-radius:999px;color:#fff}
.item.sw .who{background:var(--blue)}.item.dy .who{background:var(--red)}
.item .txt{flex:1;min-width:0;font-size:16px;word-break:break-all}
.item .txt .pl{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:13px;color:#fff;background:#03c75a;
  padding:3px 10px;border-radius:999px;text-decoration:none;box-shadow:0 2px 0 #02a049;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt .pl b{font-weight:400;background:#fff;color:#03c75a;border-radius:4px;padding:0 3px;font-size:11px;line-height:14px}
.chip .pin{font-size:9px}
.item .d{flex:none;font-size:13px;color:var(--muted);width:58px}
.del{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--cream2);color:var(--ink);font:inherit;font-size:18px;cursor:pointer;line-height:1}
.del:active{background:var(--red);color:#fff}
.emptymsg{font-size:15px;color:var(--muted);padding:6px 2px}
.item.clickable{cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--cream);color:var(--ink);border:3px solid #fff;border-radius:22px;padding:10px 18px;font-size:15px;line-height:1.4;
  display:flex;align-items:center;gap:12px;transition:.2s;z-index:10;pointer-events:none;max-width:calc(100% - 32px);
  box-shadow:0 4px 0 var(--cream2),0 8px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:var(--leaf-d);font:inherit;cursor:pointer;padding:0}
@media (max-width:360px){.cell{min-height:62px}.chip{font-size:10px}header h1{font-size:24px}}
.ver{position:relative;z-index:1;text-align:center;font-size:12px;color:rgba(255,255,255,.85);padding:0 0 calc(env(safe-area-inset-bottom) + 16px);text-shadow:0 1px 2px rgba(0,60,80,.4)}
/* 함께 · 옵션 · D-day · 수정 */
.pbtn.both{background:var(--purple);box-shadow:0 5px 0 var(--purple-d)}
.compose button.both{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.chip.both{background:var(--purple)}
.item.both{border-color:#cdb8f3}.item.both .who{background:var(--purple)}
.compose input.time{flex:none;width:100px;padding:0 8px;text-align:center}
.datepick{position:relative;flex:none;height:46px;padding:0 12px;border-radius:999px;border:3px solid #fff;background:var(--cream);
  box-shadow:0 4px 0 var(--cream2);display:flex;align-items:center;font-size:16px;color:var(--ink);white-space:nowrap;cursor:pointer}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer}
.placewrap{position:relative;flex:1;min-width:0;display:flex}
.placewrap input{padding-right:48px !important}
.compose .mapin{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:50%;
  background:#03c75a;color:#fff;font-size:15px;box-shadow:0 2px 0 #02a049}
.compose .mapin:active{transform:translateY(-50%) scale(.92)}
.compose .ico{flex:none;width:46px;padding:0;font-size:19px;background:var(--cream);box-shadow:0 4px 0 var(--cream2);filter:grayscale(.6);opacity:.8}
.compose .ico.on{background:var(--sel);box-shadow:0 4px 0 #e8c33a;filter:none;opacity:1}
.compose .ico:active{box-shadow:0 1px 0 var(--cream2)}
.editbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:6px 6px 6px 14px;border-radius:999px;
  background:#fff6cc;border:3px solid #fff;box-shadow:0 3px 0 #e8c33a;font-size:14px}
.editbar[hidden]{display:none}
.editbar #editMsg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editbar .endwrap input{height:32px;font-size:14px;padding:0 6px}
.syncdot{position:absolute;right:8px;top:40px;z-index:3;width:16px;height:16px;border-radius:50%;border:3px solid #fff;padding:0;cursor:pointer;background:#f5a742}
.syncdot.on{background:#5cc46a}.syncdot.err{background:#e8574a}
.opt.cancel{border-radius:999px;border:3px solid #fff;font:inherit;font-size:14px;padding:0 14px;cursor:pointer;background:var(--cream2);color:var(--ink);height:32px}
.endwrap{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink)}
.endwrap[hidden],.opt[hidden]{display:none}
.endwrap input{height:36px;border-radius:999px;border:3px solid #fff;background:var(--cream);color:var(--ink);font:inherit;font-size:15px;padding:0 10px;box-shadow:0 3px 0 var(--cream2)}
.ddays{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:12px}
.ddays:empty{display:none}
.dd{border:3px solid #fff;background:var(--cream);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;
  cursor:pointer;box-shadow:0 3px 0 var(--cream2)}
.dd b{font-weight:400;margin-left:2px;color:var(--leaf-d)}
.dd.sw b{color:var(--blue-d)}.dd.dy b{color:var(--red-d)}.dd.both b{color:var(--purple-d)}
.chip.span{border-radius:0;margin:0 -6px;padding:0 8px}
.chip.span.s{border-radius:8px 0 0 8px;margin-left:0;padding-left:5px}
.chip.span.e{border-radius:0 8px 8px 0;margin-right:0}
.chip.span.s.e{border-radius:8px}
.cell.rstart{border-color:var(--leaf);background:#eaf8e6;box-shadow:0 3px 0 var(--leaf-d)}
.item .tm{margin-right:6px;font-size:14px;color:var(--muted)}
.item .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.item .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--cream2);color:var(--ink)}
.item.editing{border-style:solid;background:#fff6cc}
.item .d{width:auto;min-width:58px}

/* 섬 테마 (기본 = 여름 섬) */

html[data-theme=cf] body{background:#cdc9ef}
html[data-theme=cf]{--teal:#7f8fd0;--teal-d:#5a69a8;--leaf:#8f9bd8;--leaf-d:#6672b0}
html[data-theme=nl] body{background:#cdeefb}

@media (max-width:420px){header h1{font-size:24px}}
@media (max-width:350px){header{padding:10px 16px 10px 44px}header::before{left:10px;width:22px;height:22px;margin-top:-11px}header h1{font-size:21px}#selLabel{font-size:14px}}
.cell{position:relative}
.cell .wx{position:absolute;bottom:4px;right:4px;font-size:14px;line-height:1;z-index:0}
.cell .chip,.cell .more{position:relative;z-index:1}
.wxline{margin:-2px 2px 10px;font-size:14px;color:var(--ink)}
.wxline[hidden]{display:none}
.wxline small{color:var(--muted);font-size:12px}
.setlabel{margin:14px 2px 8px;font-size:15px;color:var(--ink)}
.sheet-card h3+.setlabel{margin-top:0}
.wxset{display:flex;gap:8px;align-items:center}
.wxset select{flex:1;min-width:0;height:40px;border-radius:999px;border:3px solid #fff;background:#fffdf5;color:var(--ink);font:inherit;font-size:15px;
  padding:0 14px;box-shadow:0 3px 0 var(--cream2)}
.wxset .opt.cancel{height:40px}
.mtitle{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.mtitle::after{content:" ▾";font-size:14px;opacity:.85}
.yearbar{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:12px}
.yearbar b{font-weight:400;font-size:22px;min-width:96px;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mgrid button{height:46px;border-radius:14px;border:3px solid #fff;background:#fffdf5;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;
  box-shadow:0 3px 0 var(--cream2)}
.mgrid button.now{color:var(--leaf-d);border-color:var(--leaf)}
.mgrid button.on{background:var(--sel);box-shadow:0 3px 0 #e8c33a}
.gear{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:14px;z-index:3;width:44px;height:44px;border-radius:50%;
  border:3px solid #fff;background:var(--cream);box-shadow:0 4px 0 var(--cream2),0 6px 12px rgba(0,0,0,.12);cursor:pointer;padding:8px;
  display:flex;align-items:center;justify-content:center}
.gear svg{width:100%;height:100%;fill:var(--wood);stroke:var(--wood-d);stroke-width:1.2;stroke-linejoin:round}
.gear svg circle{fill:var(--cream)}
.gear:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cream2)}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(40,30,20,.35);display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-width:448px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--cream);border:4px solid #fff;border-radius:24px;padding:14px;
  box-shadow:0 6px 0 var(--cream2),0 16px 30px rgba(0,0,0,.25);animation:sheetUp .2s ease}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-card h3{margin:0 0 12px;font-size:18px;font-weight:400;display:flex;align-items:center;justify-content:space-between}
.sheet-card h3 span{background:var(--leaf);color:#fff;padding:3px 14px;border-radius:999px;box-shadow:0 3px 0 var(--leaf-d)}
.sheet-x{width:34px;height:34px;border-radius:50%;border:0;background:var(--cream2);color:var(--ink);font:inherit;font-size:20px;cursor:pointer;line-height:1}
.themegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.th{position:relative;height:80px;border-radius:16px;border:3px solid #fff;cursor:pointer;padding:0;font:inherit;color:#fff;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:17px;text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:0 3px 0 var(--cream2);overflow:hidden}
.th span{background:rgba(40,30,20,.32);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.3;text-align:center}
.th span small{display:block;font-size:11px;opacity:.9}
.th.on{outline:3px dashed var(--leaf-d);outline-offset:2px}
.th.on::after{content:"✓";position:absolute;top:4px;right:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--leaf-d);
  font-size:14px;line-height:22px;text-shadow:none}

<script>
(function(){
  var NAMES={sw:'상원',dy:'다윤',both:'함께'};
  var COLORS={sw:'파란색',dy:'붉은색',both:'보라색'};
  var DOW=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  var KEY='dawon-schedule-v1';
  var events=load();
  var today=new Date(); today.setHours(0,0,0,0);
  var sel=new Date(today);
  var viewY=today.getFullYear(), viewM=today.getMonth();
  var who=null, lastDeleted=null, toastTimer=null;
  // 수정 중인 일정 / 여러 날·매년 옵션
  var editing=null, editDate=null, prevWho=null, rangeMode=false, repMode=false, rangeStart=null;

  // ---------- Supabase 공유 저장소 ----------
  var SB_URL=window.SB_URL_OVERRIDE||'https://ptnhcltxswhbszpqdhho.supabase.co', SB_KEY='sb_publishable_1YSD6vFDdopEwN6ZWrJ_EQ_CBcNKlJw';
  var SECRET=(function(){ try{
      var m=location.hash.match(/[#&]k=([^&]+)/);
      if(m){ localStorage.setItem('dawon-secret',decodeURIComponent(m[1])); history.replaceState(null,'',location.pathname+location.search); }
      return window.DAWON_SECRET||localStorage.getItem('dawon-secret')||'';
    }catch(e){ return window.DAWON_SECRET||''; } })();
  var QKEY='dawon-schedule-queue-v1', INITKEY='dawon-schedule-migrated-v1';
  var queue=loadJSON(QKEY), online=null, ws=null, wsRef=0, hbTimer=null, syncing=false, resync=false;
  function loadJSON(k){ try{ var s=localStorage.getItem(k); var a=s?JSON.parse(s):[]; return Array.isArray(a)?a:[]; }catch(e){ return []; } }
  function load(){ return loadJSON(KEY); }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(events)); localStorage.setItem(QKEY,JSON.stringify(queue)); }catch(e){} }
  function sbFetch(path,opt){
    opt=opt||{}; var h={'apikey':SB_KEY,'Content-Type':'application/json'};
    if(opt.prefer) h['Prefer']=opt.prefer;
    return fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ var e=new Error(t); e.status=r.status; try{e.code=JSON.parse(t).code}catch(_){} throw e; });
        return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null}); });
  }
  function missingFn(e){ return !!e&&(e.code==='PGRST202'||e.status===404); }
  function explain(e){
    if(!e||!e.status) return '인터넷에 연결할 수 없어요 · 연결되면 자동으로 올라가요';
    if(missingFn(e)&&/dawon_(add2|update2)/.test(e.message||'')) return '함께·시간·매년·여러 날·수정은 Supabase에서 supabase-v2.sql을 실행해야 저장돼요';
    if(e.code==='PGRST202'||/dawon_/.test(e.message||'')) return '서버 설정이 아직 안 됐어요 · Supabase에서 secure.sql을 실행해 주세요';
    if(e.status===404||e.code==='PGRST205'||e.code==='42P01') return '서버에 events 테이블이 없어요 · Supabase에서 SQL을 실행해 주세요';
    if(e.status===401) return '서버 키가 맞지 않아요 (401)';
    if(e.status===403||e.code==='42501'||/forbidden/.test(e.message||'')) return '이 앱의 비밀값이 서버와 맞지 않아요';
    return '서버 오류 ('+e.status+(e.code?' '+e.code:'')+')';
  }
  function toRow(e){ return {id:e.id,date:e.date,who:e.who,text:e.text,place:e.place||null,created_at:new Date(e.t).toISOString(),
    at_time:e.time||null,end_date:e.end||null,repeat:e.rep||null}; }
  function fromRow(r){ return {id:r.id,date:r.date,who:r.who,text:r.text,place:r.place||'',t:r.created_at?Date.parse(r.created_at):0,
    time:r.at_time||'',end:r.end_date||'',rep:r.repeat||''}; }
  var statusMsg='', lastErr='';
  function setStatus(ok,msg,err){ online=ok; var d=$('sync'); if(!d)return;
    statusMsg=msg||(ok?'서버에 연결됨 · 일정이 자동으로 저장·공유돼요':'오프라인');
    d.className='syncdot '+(ok?'on':'off')+(err?' err':''); d.title=statusMsg;
    if(err&&statusMsg!==lastErr&&$('toast')) toast(statusMsg,false,4000);
    lastErr=err?statusMsg:''; }
  // 새 칸(함께·시간·여러 날·매년)을 쓰는 일정은 v2 함수로, 아니면 예전 함수로 저장
  function isExtra(r){ return r.who==='both'||!!(r.at_time||r.end_date||r.repeat); }
  function v2Body(r){ return {p_secret:SECRET,p_id:r.id,p_date:r.date,p_who:r.who,p_text:r.text,p_created:r.created_at,p_place:r.place||null,
    p_time:r.at_time||null,p_end:r.end_date||null,p_repeat:r.repeat||null}; }
  function v1Add(r){ return sbFetch('rpc/dawon_add',{method:'POST',body:{p_secret:SECRET,p_id:r.id,p_date:r.date,p_who:r.who,p_text:r.text,p_created:r.created_at,p_place:r.place||null}}); }
  function v1Del(id){ return sbFetch('rpc/dawon_delete',{method:'POST',body:{p_secret:SECRET,p_id:id}}); }
  function flushQueue(){
    if(!queue.length) return Promise.resolve();
    var op=queue[0];
    var r=op.row, p;
    if(op.op==='ins') p=isExtra(r)?sbFetch('rpc/dawon_add2',{method:'POST',body:v2Body(r)}):v1Add(r);
    else if(op.op==='upd') p=sbFetch('rpc/dawon_update2',{method:'POST',body:v2Body(r)}).catch(function(e){
      // 서버에 v2가 없으면 예전 방식(지우고 다시 넣기)으로 수정
      if(!isExtra(r)&&missingFn(e)) return v1Del(r.id).then(function(){ return v1Add(r); });
      throw e; });
    else p=v1Del(op.id);
    return p.then(function(){ var i=queue.indexOf(op); if(i>=0) queue.splice(i,1); save(); return flushQueue(); });
  }
  function fetchList(){
    return sbFetch('rpc/dawon_list2',{method:'POST',body:{p_secret:SECRET}}).catch(function(e){
      if(missingFn(e)) return sbFetch('rpc/dawon_list',{method:'POST',body:{p_secret:SECRET}});
      throw e; });
  }
  function sync(){
    if(syncing){ resync=true; return; } syncing=true;
    var pushErr=null;
    flushQueue().catch(function(e){ pushErr=e; }).then(fetchList).then(function(rows){
      var remote=(rows||[]).map(fromRow);
      // 아직 못 올린 변경은 화면에 그대로 유지
      queue.forEach(function(op){
        if(op.op==='ins'){ if(!remote.some(function(e){return e.id===op.row.id})) remote.push(fromRow(op.row)); }
        else if(op.op==='upd'){ for(var i=0;i<remote.length;i++) if(remote[i].id===op.row.id) remote[i]=fromRow(op.row); }
        else remote=remote.filter(function(e){return e.id!==op.id});
      });
      events=remote; save();
      if(pushErr&&pushErr.status) setStatus(true,'불러오기는 되지만 저장이 안 돼요 · '+explain(pushErr),true); else setStatus(true);
      renderHeader(); renderGrid(); renderLists();
    }).catch(function(e){ setStatus(false,explain(e),!!(e&&e.status)); })
      .then(function(){ syncing=false; if(resync){ resync=false; sync(); } });
  }
  function pushInsert(e){ queue.push({op:'ins',row:toRow(e)}); save(); sync(); }
  // 지금 서버로 보내는 중일 수 있는 맨 앞 항목은 건드리지 않음
  function busyOp(){ return syncing?queue[0]:null; }
  function pushUpdate(e){
    var row=toRow(e), busy=busyOp(), hit=false;
    queue.forEach(function(op){ if(op!==busy&&(op.op==='ins'||op.op==='upd')&&op.row.id===e.id){ op.row=row; hit=true; } });
    if(!hit) queue.push({op:'upd',row:row});
    save(); sync();
  }
  function pushDelete(id){
    var busy=busyOp(), hadIns=false;
    queue=queue.filter(function(op){
      if(op===busy||op.op==='del'||op.row.id!==id) return true;
      if(op.op==='ins') hadIns=true;
      return false;
    });
    if(!hadIns) queue.push({op:'del',id:id});
    save(); sync();
  }
  function connectRealtime(){
    if(!window.WebSocket||window.SB_NO_WS) return;
    try{ ws=new WebSocket(SB_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0'); }catch(e){ return; }
    ws.onopen=function(){
      ws.send(JSON.stringify({topic:'realtime:dawon-events',event:'phx_join',ref:String(++wsRef),
        payload:{config:{broadcast:{self:false},presence:{key:''},postgres_changes:[{event:'*',schema:'public',table:'events'}]}}}));
      clearInterval(hbTimer);
      hbTimer=setInterval(function(){ try{ ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++wsRef)})); }catch(e){} },25000);
    };
    ws.onmessage=function(m){ try{ var d=JSON.parse(m.data); if(d.event==='postgres_changes') sync(); }catch(e){} };
    ws.onclose=function(){ clearInterval(hbTimer); setTimeout(connectRealtime,5000); };
    ws.onerror=function(){ try{ws.close()}catch(e){} };
  }

  // ---------- 날짜 도우미 ----------
  function pad(n){return (n<10?'0':'')+n}
  function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parse(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function label(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+DOW[d.getDay()]}
  function md(k){var d=parse(k);return (d.getMonth()+1)+'/'+d.getDate()}
  function addDays(k,n){var d=parse(k);d.setDate(d.getDate()+n);return key(d)}
  function diffDays(a,b){return Math.round((parse(b)-parse(a))/864e5)}
  function leap(y){return y%4===0&&(y%100!==0||y%400===0)}
  function yearlyKey(e,y){var m=e.date.slice(5);if(m==='02-29'&&!leap(y))m='02-28';return y+'-'+m}
  function nextOcc(e,tk){var y=+tk.slice(0,4),k=yearlyKey(e,y);if(k<tk)k=yearlyKey(e,y+1);return k<e.date?e.date:k}
  function isSpan(e){return !!(e.end&&e.end>e.date&&e.rep!=='y')}
  function occursOn(e,k){
    if(e.rep==='y') return k>=e.date&&yearlyKey(e,+k.slice(0,4))===k;
    if(isSpan(e)) return k>=e.date&&k<=e.end;
    return e.date===k;
  }
  // 여러 날 → 시간 없는 일정 → 시간 순
  function cmp(a,b){
    var sa=isSpan(a)?0:1, sb=isSpan(b)?0:1; if(sa!==sb) return sa-sb;
    if(!sa&&a.date!==b.date) return a.date<b.date?-1:1;
    var ta=a.time||'', tb=b.time||''; if(ta!==tb) return ta<tb?-1:1;
    return a.t-b.t;
  }
  function byDate(k){return events.filter(function(e){return occursOn(e,k)}).sort(cmp)}
  function shortTime(t){if(!t)return '';var h=+t.slice(0,2),m=t.slice(3,5);return m==='00'?h+'시':h+':'+m}
  function findEv(id){for(var i=0;i<events.length;i++) if(events[i].id===id) return events[i]; return null}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  var $=function(id){return document.getElementById(id)};

  // ---------- 그리기 ----------
  function renderHeader(){
    $('selLabel').textContent=label(today);
    var pk=editing?editDate:key(sel); $('dateLbl').textContent='📅 '+md(pk); $('dateIn').value=pk;
    $('dayTitle').textContent=label(sel);
    renderDdays();
  }
  function renderDdays(){
    var box=$('ddays'); box.innerHTML='';
    var tk=key(today), reps=events.filter(function(e){return e.rep==='y'});
    // 가장 오래된 '함께 + 매년' 일정 = 우리 기념일, 오늘이 며칠째인지
    var since=reps.filter(function(e){return e.who==='both'&&e.date<=tk}).sort(function(a,b){return a.date<b.date?-1:1})[0];
    if(since){ var b=el('button','dd both'); b.type='button'; b.appendChild(document.createTextNode('💕 '+since.text+' '));
      b.appendChild(el('b',null,(diffDays(since.date,tk)+1)+'일째'));
      b.addEventListener('click',function(){ selectDate(parse(since.date)); }); box.appendChild(b); }
    reps.map(function(e){ var k=nextOcc(e,tk); return {e:e,k:k,d:diffDays(tk,k)}; })
      .sort(function(a,b){return a.d-b.d}).slice(0,3).forEach(function(x){
        var e=x.e, yrs=+x.k.slice(0,4)-+e.date.slice(0,4);
        var icon=/생일/.test(e.text)?'🎂':e.who==='both'?'💕':'🔁';
        var b=el('button','dd '+e.who); b.type='button';
        b.appendChild(document.createTextNode(icon+' '+e.text+(e.who==='both'&&yrs>0?' '+yrs+'주년':'')+' '));
        b.appendChild(el('b',null,x.d===0?'D-DAY 🎉':'D-'+x.d));
        b.addEventListener('click',function(){ selectDate(parse(x.k)); });
        box.appendChild(b);
      });
  }
  function renderPeople(){
    var btns=document.querySelectorAll('.pbtn');
    for(var i=0;i<btns.length;i++) btns[i].classList.toggle('on',btns[i].getAttribute('data-who')===who);
    var add=$('addBtn'); add.className=who||''; add.textContent=editing?'저장':'추가';
    $('rangeOpt').classList.toggle('on',rangeMode);
    $('repOpt').classList.toggle('on',repMode);
    $('endWrap').hidden=!(editing&&rangeMode);
    $('rangeOpt').setAttribute('aria-pressed',rangeMode); $('repOpt').setAttribute('aria-pressed',repMode);
    $('editBar').hidden=!editing;
    if(editing) $('editMsg').textContent='✏️ '+md(editDate)+(rangeMode?'':' 일정 수정 중');
  }
  function renderGrid(){
    $('monthTitle').textContent=viewY+'년 '+(viewM+1)+'월';
    var g=$('grid'); g.innerHTML='';
    var first=new Date(viewY,viewM,1), days=new Date(viewY,viewM+1,0).getDate();
    for(var i=0;i<first.getDay();i++) g.appendChild(el('div','cell empty'));
    var selK=key(sel), todayK=key(today);
    for(var d=1;d<=days;d++){
      var date=new Date(viewY,viewM,d), k=key(date);
      var c=el('button','cell'); c.type='button'; c.setAttribute('data-k',k);
      if(date.getDay()===0)c.classList.add('sun'); if(date.getDay()===6)c.classList.add('sat');
      if(k===todayK)c.classList.add('today'); if(k===selK)c.classList.add('sel');
      if(k===rangeStart)c.classList.add('rstart');
      c.appendChild(el('span','num',d));
      var w=wxOf(k); if(w) c.appendChild(el('span','wx',w.icon));
      var evs=byDate(k), max=2;
      for(var j=0;j<Math.min(evs.length,max);j++){
        var e=evs[j];
        if(isSpan(e)){
          // 여러 날 일정은 이어진 띠로, 글자는 첫날·주의 첫날·달의 첫날에만
          var head=k===e.date||date.getDay()===0||d===1;
          c.appendChild(el('span','chip span '+e.who+(k===e.date?' s':'')+(k===e.end?' e':''),head?e.text:' '));
        } else c.appendChild(el('span','chip '+e.who,e.text));
      }
      if(evs.length>max) c.appendChild(el('span','more','+'+(evs.length-max)));
      g.appendChild(c);
    }
  }
  function itemRow(e,showDate,occK){
    var r=el('div','item '+e.who+' clickable'+(editing===e.id?' editing':''));
    if(showDate){ var dd=parse(occK);
      r.appendChild(el('span','d',isSpan(e)?md(e.date)+'~'+md(e.end):(dd.getMonth()+1)+'/'+dd.getDate()+' '+DOW[dd.getDay()][0])); }
    r.addEventListener('click',function(ev){ if(ev.target.closest('.del')||ev.target.closest('.pl'))return;
      if(showDate) selectDate(parse(occK)); else startEdit(e); });
    r.appendChild(el('span','who',NAMES[e.who]));
    var tx=el('span','txt'), line=el('div');
    if(e.time) line.appendChild(el('span','tm',shortTime(e.time)));
    line.appendChild(document.createTextNode(e.text)); tx.appendChild(line);
    var tags=[];
    if(isSpan(e)) tags.push('🧳 '+md(e.date)+'~'+md(e.end)+' · '+(diffDays(e.date,e.end)+1)+'일');
    if(e.rep==='y'){ var yrs=+occK.slice(0,4)-+e.date.slice(0,4); tags.push(e.who==='both'&&yrs>0?'💕 '+yrs+'주년':'🔁 매년'); }
    if(tags.length){ var tg=el('div','tags'); tags.forEach(function(t){ tg.appendChild(el('span','tag',t)); }); tx.appendChild(tg); }
    if(e.place){ var a=el('a','pl'); a.href=mapUrl(e.place); a.appendChild(el('b',null,'N')); a.appendChild(document.createTextNode(' '+e.place));
      a.addEventListener('click',function(ev){ ev.stopPropagation(); ev.preventDefault(); openMap(e.place); }); tx.appendChild(a); }
    r.appendChild(tx);
    var x=el('button','del','×'); x.type='button'; x.setAttribute('aria-label','삭제');
    x.addEventListener('click',function(ev){ ev.stopPropagation(); remove(e.id); });
    r.appendChild(x);
    return r;
  }
  // 이번 달에 보이는 일정 (여러 날은 한 번, 매년은 올해 날짜로)
  function monthItems(){
    var first=key(new Date(viewY,viewM,1)), last=key(new Date(viewY,viewM+1,0)), out=[];
    events.forEach(function(e){
      if(e.rep==='y'){ var k=yearlyKey(e,viewY); if(k>=first&&k<=last&&k>=e.date) out.push({e:e,k:k}); }
      else { var end=isSpan(e)?e.end:e.date; if(end>=first&&e.date<=last) out.push({e:e,k:e.date<first?first:e.date}); }
    });
    return out.sort(function(a,b){ return a.k<b.k?-1:a.k>b.k?1:cmp(a.e,b.e); });
  }
  function renderLists(){
    var k=key(sel), evs=byDate(k), L=$('dayList'); L.innerHTML='';
    function cnt(w){ return evs.filter(function(e){return e.who===w}).length; }
    renderDayWx(k);
    $('dayCount').textContent=evs.length?('상원 '+cnt('sw')+' · 다윤 '+cnt('dy')+(cnt('both')?' · 함께 '+cnt('both'):'')):'';
    if(!evs.length) L.appendChild(el('div','emptymsg','이 날은 아직 일정이 없어요.'));
    evs.forEach(function(e){L.appendChild(itemRow(e,false,k))});
    var ms=monthItems();
    $('monthListTitle').textContent=(viewM+1)+'월 전체 일정';
    $('monthCount').textContent=ms.length?ms.length+'개':'';
    var M=$('monthList'); M.innerHTML='';
    if(!ms.length) M.appendChild(el('div','emptymsg','이번 달 일정이 아직 없어요.'));
    ms.forEach(function(x){M.appendChild(itemRow(x.e,true,x.k))});
  }
  function renderAll(){renderHeader();renderPeople();renderGrid();renderLists();}
  function selectDate(d){
    sel=new Date(d); if(sel.getFullYear()!==viewY||sel.getMonth()!==viewM){viewY=sel.getFullYear();viewM=sel.getMonth();}
    renderHeader();renderGrid();renderLists();
  }

  // ---------- 추가 · 수정 · 삭제 ----------
  function clearInputs(){ $('text').value=''; $('place').value=''; $('time').value=''; $('endDate').value=''; }
  function addEvent(k,end){
    if(!who){ toast('먼저 상원·함께·다윤 중에 골라주세요',false); return false; }
    var t=$('text').value.trim();
    if(!t){ toast('일정 내용을 먼저 적어주세요',false); return false; }
    var ne={id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date:k,who:who,text:t,place:$('place').value.trim(),
      time:$('time').value||'',end:end||'',rep:repMode?'y':'',t:Date.now()};
    events.push(ne); save(); pushInsert(ne); clearInputs();
    rangeMode=false; repMode=false; rangeStart=null; renderPeople();
    toast(NAMES[who]+' 일정 추가 · '+(end?md(k)+'~'+md(end):label(parse(k)))+(ne.rep?' · 매년':''),false);
    return true;
  }
  function startEdit(e){
    if(!editing) prevWho=who;
    editing=e.id; editDate=e.date; who=e.who; rangeStart=null;
    $('text').value=e.text; $('place').value=e.place||''; $('time').value=e.time||'';
    rangeMode=isSpan(e); repMode=e.rep==='y'; $('endDate').value=isSpan(e)?e.end:'';
    renderAll(); toast('✏️ 날짜를 누르면 날짜가 바뀌어요',false,2500);
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){ window.scrollTo(0,0); }
  }
  function endEdit(){
    editing=null; editDate=null; who=prevWho; prevWho=null; rangeMode=false; repMode=false; rangeStart=null;
    clearInputs(); renderAll();
  }
  function setEditDate(k){
    var nk=k;
    // 매년 일정은 처음 해를 그대로 두고 월·일만 바꿈
    if(repMode){ nk=editDate.slice(0,4)+k.slice(4); if(key(parse(nk))!==nk) nk=k; }
    var end=$('endDate').value;
    if(rangeMode&&end) $('endDate').value=addDays(end,diffDays(editDate,nk));
    editDate=nk; sel=parse(k);
  }
  function saveEdit(){
    var e=findEv(editing);
    if(!e){ toast('그 일정은 이미 지워졌어요',false); endEdit(); return; }
    var end='';
    if(rangeMode){ end=$('endDate').value||'';
      if(!end){ toast('끝나는 날을 골라주세요',false); return; }
      if(end<=editDate){ toast('끝나는 날은 시작하는 날보다 뒤여야 해요',false); return; } }
    if(!$('text').value.trim()){ toast('일정 내용을 적어주세요',false); return; }
    e.date=editDate; e.who=who; e.text=$('text').value.trim(); e.place=$('place').value.trim();
    e.time=$('time').value||''; e.end=end; e.rep=repMode?'y':'';
    save(); pushUpdate(e); endEdit();
    toast('일정을 고쳤어요',false);
  }
  function submit(){
    if(editing){ saveEdit(); return; }
    if(rangeMode&&who){
      if(!rangeStart){ toast('달력에서 시작하는 날과 끝나는 날을 차례로 눌러주세요',false); return; }
      addRange(key(sel)); return;
    }
    if(addEvent(key(sel))){renderGrid();renderLists();}
  }
  function addRange(k){
    var a=rangeStart<k?rangeStart:k, b=rangeStart<k?k:rangeStart;
    rangeStart=null; sel=parse(a);
    var added=addEvent(a,a===b?'':b);
    renderAll(); return added;
  }
  function remove(id){
    var i=-1; for(var j=0;j<events.length;j++) if(events[j].id===id){i=j;break;}
    if(i<0)return; lastDeleted=events.splice(i,1)[0]; save(); pushDelete(id);
    if(editing===id) endEdit();
    renderHeader();renderGrid();renderLists(); toast('일정을 지웠어요',true);
  }
  function mapUrl(q){ return 'https://map.naver.com/p/search/'+encodeURIComponent(q); }
  function openMap(q){ if(!q){ toast('장소를 먼저 적어주세요',false); return; } location.href=mapUrl(q); }
  function toast(msg,undo,ms){
    $('toastMsg').textContent=msg; $('undoBtn').style.display=undo?'':'none';
    var t=$('toast'); t.classList.add('show'); clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.classList.remove('show')},ms||(undo?4000:1800));
  }

  $('grid').addEventListener('click',function(ev){
    var c=ev.target.closest('.cell'); if(!c||c.classList.contains('empty'))return;
    var k=c.getAttribute('data-k'), added=false;
    if(editing){ setEditDate(k); renderAll(); return; }
    var ready=who&&!!$('text').value.trim();
    if(ready&&rangeMode){
      if(!rangeStart){ rangeStart=k; sel=parse(k); renderAll(); toast('🧳 '+md(k)+'부터 · 끝나는 날을 눌러주세요',false,4000); return; }
      var a=rangeStart<k?rangeStart:k; added=addRange(k); k=a;
    } else {
      sel=parse(k);
      if(!who&&$('text').value.trim()) toast('상원·함께·다윤 중에 먼저 골라주세요',false);
      added=ready?addEvent(k):false;
      renderHeader();renderGrid();renderLists();
    }
    var nc=document.querySelector('.cell[data-k="'+k+'"]'); if(nc&&added){nc.classList.add('flash');}
  });
  document.querySelectorAll('.pbtn').forEach(function(b){
    b.addEventListener('click',function(){ var w=b.getAttribute('data-who');
      who=editing?w:(who===w)?null:w; if(!who) rangeStart=null; renderPeople(); });
  });
  $('rangeOpt').addEventListener('click',function(){ rangeMode=!rangeMode; rangeStart=null; if(rangeMode) repMode=false;
    if(editing&&rangeMode&&!$('endDate').value) $('endDate').value=addDays(editDate,1);
    if(!editing) toast(rangeMode?'🧳 시작하는 날과 끝나는 날을 차례로 눌러주세요':'여러 날 끔',false,rangeMode?3500:1200);
    renderPeople(); renderGrid(); });
  $('repOpt').addEventListener('click',function(){ repMode=!repMode; if(repMode){ rangeMode=false; rangeStart=null; }
    if(!editing) toast(repMode?'🔁 추가하는 일정이 해마다 나와요':'매년 반복 끔',false,repMode?2500:1200);
    renderPeople(); renderGrid(); });
  $('sync').addEventListener('click',function(){ toast(statusMsg,false,3000); });
  // 일정 내용 옆 날짜 고르기: 고른 날짜로 이동하고, 추가 버튼은 그 날짜에 넣음
  $('dateIn').addEventListener('click',function(){ try{ this.showPicker(); }catch(e){} });
  $('dateIn').addEventListener('change',function(){
    var v=this.value; if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    if(editing){ setEditDate(v); selectDate(parse(v)); renderPeople(); return; }
    selectDate(parse(v));
    if(who&&$('text').value.trim()&&!rangeMode) toast('📅 '+md(v)+' · 추가를 누르면 이 날에 들어가요',false,2500);
  });
  // 년·월 골라서 이동
  var jumpY=viewY;
  function renderJump(){
    $('jyLabel').textContent=jumpY+'년';
    var g=$('jmGrid'); g.innerHTML='';
    for(var m=0;m<12;m++){ (function(m){
      var b=el('button',(jumpY===viewY&&m===viewM?'on':'')+(jumpY===today.getFullYear()&&m===today.getMonth()?' now':''),(m+1)+'월'); b.type='button';
      b.addEventListener('click',function(){ viewY=jumpY; viewM=m; $('jumpSheet').hidden=true; renderGrid(); renderLists(); });
      g.appendChild(b); })(m); }
  }
  $('monthTitle').addEventListener('click',function(){ jumpY=viewY; renderJump(); $('jumpSheet').hidden=false; });
  $('jyPrev').addEventListener('click',function(){ jumpY--; renderJump(); });
  $('jyNext').addEventListener('click',function(){ jumpY++; renderJump(); });
  $('jumpClose').addEventListener('click',function(){ $('jumpSheet').hidden=true; });
  $('jumpSheet').addEventListener('click',function(ev){ if(ev.target===this) this.hidden=true; });
  $('cancelEdit').addEventListener('click',endEdit);
  $('mapCheck').addEventListener('click',function(){ openMap($('place').value.trim()); });
  $('addBtn').addEventListener('click',submit);
  ['text','place'].forEach(function(id){
    $(id).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); this.blur(); } });
  });
  $('prev').addEventListener('click',function(){ viewM--; if(viewM<0){viewM=11;viewY--;} renderGrid();renderLists(); });
  $('next').addEventListener('click',function(){ viewM++; if(viewM>11){viewM=0;viewY++;} renderGrid();renderLists(); });
  $('todayBtn').addEventListener('click',function(){ selectDate(today); });
  $('undoBtn').addEventListener('click',function(){ if(lastDeleted){events.push(lastDeleted);save();pushInsert(lastDeleted);lastDeleted=null;renderHeader();renderGrid();renderLists();} $('toast').classList.remove('show'); });

  // ---------- 섬 테마 ----------
  var THEMES=[
    {id:'ww',name:'놀동숲',color:'#2f3f86',sw:'linear-gradient(#2f3f86 0 30%,#7f86c6 30% 50%,#f4c9a6 50% 62%,#86c866 62%)'},
    {id:'cf',name:'타놀동숲',color:'#9fb3ea',sw:'linear-gradient(#cdc9ef 0 30%,#8f9bd0 30% 62%,#8acb6a 62%)'},
    {id:'nl',name:'튀동숲',color:'#86d4f7',sw:'linear-gradient(#86d4f7 0 50%,#7fcf5c 50% 80%,#f4e3b5 80% 86%,#5cc9d8 86%)'},
    {id:'summer',name:'모동숲',color:'#7fd3f5',sw:'linear-gradient(#7fd3f5 0 45%,#5cc9d8 45% 62%,#8fd16a 62%)'}
  ];
  function curTheme(){ var t=document.documentElement.getAttribute('data-theme')||'summer', d=THEMES[3];
    for(var i=0;i<THEMES.length;i++) if(THEMES[i].id===t) return THEMES[i];
    document.documentElement.removeAttribute('data-theme'); return d; }
  function applyTheme(id){
    if(id==='summer') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',id);
    try{ localStorage.setItem('dawon-theme',id); }catch(e){}
    renderThemes();
  }
  function renderThemes(){
    var cur=curTheme(), g=$('themeGrid'); g.innerHTML='';
    var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',cur.color);
    var grid=el('div','themegrid'); g.appendChild(grid);
    THEMES.forEach(function(t){
      var b=el('button','th'+(t.id===cur.id?' on':'')); b.type='button';
      var lb=el('span',null,t.name); if(t.sub) lb.appendChild(el('small',null,t.sub)); b.appendChild(lb);
      b.style.background=t.sw; b.setAttribute('aria-label',t.name+' 테마');
      b.addEventListener('click',function(){ applyTheme(t.id); toast(t.name+' 테마로 바꿨어요',false); });
      grid.appendChild(b);
    });
  }
  renderThemes();

  // ---------- 날씨 미리보기 (Open-Meteo, 키 필요 없음) ----------
  var CITIES=[['화성',37.1995,126.8313],['서울',37.5665,126.978],['인천',37.4563,126.7052],['수원',37.2636,127.0286],['춘천',37.8813,127.7298],['강릉',37.7519,128.8761],
    ['청주',36.6424,127.489],['대전',36.3504,127.3845],['전주',35.8242,127.148],['광주',35.1595,126.8526],['대구',35.8714,128.6014],
    ['울산',35.5384,129.3114],['부산',35.1796,129.0756],['제주',33.4996,126.5312]];
  var WXKEY='dawon-weather-v1', LOCKEY='dawon-weather-loc';
  var wxLoc=(function(){ try{ var l=JSON.parse(localStorage.getItem(LOCKEY)); if(l&&isFinite(l.lat)&&isFinite(l.lon)) return l; }catch(e){} return {name:'화성',lat:37.1995,lon:126.8313}; })();
  var wx=(function(){ try{ return JSON.parse(localStorage.getItem(WXKEY))||null; }catch(e){ return null; } })();
  function wxInfo(c){
    if(c===0) return ['☀️','맑음']; if(c===1) return ['🌤️','대체로 맑음']; if(c===2) return ['⛅','구름 조금']; if(c===3) return ['☁️','흐림'];
    if(c===45||c===48) return ['🌫️','안개']; if(c>=51&&c<=57) return ['🌦️','이슬비']; if(c>=61&&c<=67) return ['🌧️','비'];
    if(c>=71&&c<=77) return ['❄️','눈']; if(c>=80&&c<=82) return ['🌧️','소나기']; if(c===85||c===86) return ['🌨️','눈 소나기'];
    if(c>=95) return ['⛈️','뇌우']; return ['🌡️',''];
  }
  function wxFresh(){ return wx&&wx.lat===wxLoc.lat&&wx.lon===wxLoc.lon&&Date.now()-wx.at<3600e3; }
  function wxOf(k){
    if(!wx||wx.lat!==wxLoc.lat||wx.lon!==wxLoc.lon||k<key(today)) return null;
    var d=wx.days[k]; if(!d) return null; var i=wxInfo(d.c);
    return {icon:i[0],desc:i[1],hi:d.hi,lo:d.lo,rain:d.p};
  }
  function renderDayWx(k){
    var box=$('dayWx'), w=wxOf(k); box.hidden=!w; box.innerHTML=''; if(!w) return;
    box.appendChild(document.createTextNode(w.icon+' '+w.desc+' · '+Math.round(w.hi)+'° / '+Math.round(w.lo)+'°'+(w.rain!=null?' · 비 '+w.rain+'%':'')+' '));
    box.appendChild(el('small',null,wxLoc.name));
  }
  function loadWeather(force){
    if(!force&&wxFresh()) return;
    var loc=wxLoc;
    fetch('https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=7')
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(j){
        var d=j.daily, days={};
        for(var i=0;i<d.time.length;i++) days[d.time[i]]={c:d.weather_code[i],hi:d.temperature_2m_max[i],lo:d.temperature_2m_min[i],p:d.precipitation_probability_max?d.precipitation_probability_max[i]:null};
        wx={lat:loc.lat,lon:loc.lon,at:Date.now(),days:days};
        try{ localStorage.setItem(WXKEY,JSON.stringify(wx)); }catch(e){}
        renderGrid(); renderLists();
      }).catch(function(){});
  }
  function setWxLoc(l){ wxLoc=l; try{ localStorage.setItem(LOCKEY,JSON.stringify(l)); }catch(e){} renderWxSet(); renderGrid(); renderLists(); loadWeather(true); }
  function renderWxSet(){
    var sel=$('wxCity'); sel.innerHTML='';
    var here=CITIES.every(function(c){ return c[1]!==wxLoc.lat||c[2]!==wxLoc.lon; });
    if(here){ var o=el('option',null,'📍 '+wxLoc.name); o.value='here'; sel.appendChild(o); }
    CITIES.forEach(function(c,i){ var o=el('option',null,c[0]); o.value=i; if(!here&&c[1]===wxLoc.lat&&c[2]===wxLoc.lon) o.selected=true; sel.appendChild(o); });
  }
  $('wxCity').addEventListener('change',function(){ if(this.value==='here') return; var c=CITIES[+this.value]; setWxLoc({name:c[0],lat:c[1],lon:c[2]}); toast('🌤️ '+c[0]+' 날씨로 바꿨어요',false); });
  $('wxHere').addEventListener('click',function(){
    if(!navigator.geolocation){ toast('이 기기에서는 위치를 쓸 수 없어요',false); return; }
    toast('📍 위치를 찾는 중…',false);
    navigator.geolocation.getCurrentPosition(function(pos){
      setWxLoc({name:'현재 위치',lat:Math.round(pos.coords.latitude*100)/100,lon:Math.round(pos.coords.longitude*100)/100});
      toast('📍 현재 위치 날씨로 바꿨어요',false);
    },function(){ toast('위치 권한이 없어서 가져오지 못했어요',false); },{timeout:10000,maximumAge:600000});
  });
  renderWxSet();
  loadWeather(false);
  setInterval(function(){ loadWeather(false); },15*60e3);
  function openSettings(){ $('settings').hidden=false; }
  function closeSettings(){ $('settings').hidden=true; }
  $('gearBtn').addEventListener('click',openSettings);
  $('settingsClose').addEventListener('click',closeSettings);
  $('settings').addEventListener('click',function(ev){ if(ev.target===this) closeSettings(); });
  document.addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ closeSettings(); $('jumpSheet').hidden=true; } });

  renderAll();
  // 예전 버전에서 이 폰에만 저장된 일정도 서버로 올림 (한 번만)
  try{ if(!localStorage.getItem(INITKEY)){ events.forEach(function(e){ queue.push({op:'ins',row:toRow(e)}); }); localStorage.setItem(INITKEY,'1'); save(); } }catch(e){}
  setStatus(false,'연결하는 중…');
  if(!SECRET){ setStatus(false,'이 페이지는 두 사람의 앱에서만 일정을 볼 수 있어요',true); return; }
  sync();
  setInterval(sync,10000);
  function refreshToday(){ var n=new Date(); n.setHours(0,0,0,0); if(n.getTime()!==today.getTime()){ today=n; renderAll(); } }
  setInterval(refreshToday,30000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ refreshToday(); sync(); loadWeather(false); } });
  window.addEventListener('online',sync);
})();
</script>
</body>
</html>
